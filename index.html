<!DOCTYPE html>
<html lang="pt - BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css\style.css">
    <script defer src="\js\database.js"></script>
    <script defer src="\js\index.js"></script>
</head>

<body>
    <header>
        <figure><img class="logo" src="img\logo.png" alt="Logo"></figure>

        <nav>
            <ul class="filtros">
                <li class="liFiltros">Todos</li>
                <li class="liFiltros">Acessórios</li>
                <li class="liFiltros">Calçados</li>
                <li class="liFiltros">Camisetas</li>
            </ul>
        </nav>

    </header>

    <main>
        <ul class="cards"></ul>

        <aside>
            <input type="text" class="inputPesq" placeholder="Digite aqui sua pesquisa">
            <input type="button" class="pesquisar" value="Pesquisar">

            <section class="carrinho">
                <h1>Carrinho de compras</h1>
                <ul class="ulCarrinho">
                    <li id="carrinho-vazio">
                        <div>
                            <h2><strong>Carrinho vazio</strong></h2>
                            <small>Adicione itens</small>
                        </div>
                    </li>
                </ul>

                <div class="caixa">

                    <div class="sub-caixa">
                        <p>Quantidade:</p>
                        <p class="quantidade"></p>
                    </div>

                    <div class="sub-caixa">
                        <p>Total:</p>
                        <p class="valor-total"></p>
                    </div>

                </div>
            </section>
        </aside>


    </main>




</body>

</html>
